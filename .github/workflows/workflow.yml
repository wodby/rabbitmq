name: Build docker image

on:
  push:
    branches:
      - master
      - main

    tags:
      - '*'

env:
  RABBITMQ43: '4.3.6'
  RABBITMQ42: '4.2.9'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      rabbitmq-versions: ${{ steps.set-matrix.outputs.rabbitmq-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "rabbitmq43", "version": "${{ env.RABBITMQ43 }}"},
            {"key": "rabbitmq42", "version": "${{ env.RABBITMQ42 }}"}
          ]
          EOF
          echo "rabbitmq-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        rabbitmq: ${{ fromJson(needs.setup.outputs.rabbitmq-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          RABBITMQ_VER: ${{ matrix.rabbitmq.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        if: github.event_name == 'push'
        uses: ./.github/actions/scout
        with:
          image: local://${{ steps.build-image.outputs.image }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          RABBITMQ_VER: ${{ matrix.rabbitmq.version }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        rabbitmq: ${{ fromJson(needs.setup.outputs.rabbitmq-versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.rabbitmq.version }}
